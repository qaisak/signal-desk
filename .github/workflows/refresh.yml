name: refresh signals
on:
  schedule:
    - cron: "0 7 * * 1-5"      # 07:00 UTC, weekdays (08:00 UK in summer)
  workflow_dispatch:           # "Run workflow" button for a manual refresh
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests feedparser
      - run: python signals.py
      - run: python dashboard.py
      - run: |
          true
          git config user.name "signal-desk bot" && git config user.email "bot@users.noreply.github.com"
          git add data/signals.json index.html docs/index.html
          git commit -m "refresh $(date -u +%F)" || echo "no change"
          git push
