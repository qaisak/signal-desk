name: refresh signals
# Daily signal refresh. Runs on GitHub so it happens whether or not the laptop
# is on; the hosted server pulls the result within ten minutes. Briefs are only
# written here if ANTHROPIC_API_KEY is set as a repo secret (the hosted server
# writes them on demand anyway).
on:
  schedule:
    - cron: "0 7 * * 1-5"
  workflow_dispatch:
concurrency:
  group: desk
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: briefs are skipped without it
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}           # optional: morning digest to a channel
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests feedparser anthropic python-pptx
      - run: python signals.py
      - run: python brief.py
      - run: python deck.py
      - run: python dashboard.py
      - run: |
          git config user.name "signal-desk bot" && git config user.email "bot@users.noreply.github.com"
          git add data/signals.json data/briefs index.html docs/index.html docs/briefs docs/digest.md
          git commit -m "refresh $(date -u +%F)" || echo "no change"
          for i in 1 2 3; do git push && break; git fetch origin main; git rebase -X theirs origin/main || { git rebase --abort; exit 1; }; done
